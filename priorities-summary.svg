<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">My Priorities</title>
  <desc id="desc">An illustration representing family, girlfriend, work, studies, and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#111b2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="68%">
      <stop offset="0" stop-color="#f0bd68" stop-opacity=".17"/>
      <stop offset=".45" stop-color="#f0bd68" stop-opacity=".045"/>
      <stop offset="1" stop-color="#f0bd68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0bd68" stop-opacity=".48"/>
      <stop offset="1" stop-color="#f0bd68" stop-opacity=".08"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#glow)"/>

  <g opacity=".16" fill="none" stroke="#ffffff">
    <path d="M0 585 C260 515 400 545 610 500 C830 452 1000 480 1210 430 C1390 387 1510 392 1600 370" stroke-width="2"/>
    <path d="M0 620 C260 550 430 590 640 540 C880 485 1050 520 1260 470 C1410 435 1510 438 1600 420" stroke-width="1.5"/>
  </g>

  <g opacity=".24">
    <circle cx="800" cy="374" r="255" fill="#f0bd68" opacity=".04"/>
    <circle cx="800" cy="374" r="180" fill="none" stroke="#f0bd68" stroke-opacity=".14"/>
    <circle cx="800" cy="374" r="290" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
  </g>

  <!-- future path -->
  <path d="M628 780 C690 680 748 590 792 496 C820 436 832 390 842 338 C862 456 915 580 1010 780 Z" fill="url(#road)" opacity=".48"/>
  <path d="M842 338 C830 440 792 554 704 730" fill="none" stroke="#f0bd68" stroke-opacity=".68" stroke-width="4" stroke-dasharray="7 16"/>

  <!-- connectors -->
  <g fill="none" stroke="#f0bd68" stroke-opacity=".28" stroke-width="2">
    <path d="M800 382 C640 360 515 286 350 218"/>
    <path d="M800 382 C680 305 645 196 610 128"/>
    <path d="M800 382 C920 305 955 196 990 128"/>
    <path d="M800 382 C960 360 1085 286 1250 218"/>
    <path d="M800 382 C800 500 800 555 800 620"/>
  </g>

  <!-- central person -->
  <g transform="translate(800 376)" filter="url(#shadow)">
    <circle cy="-56" r="34" fill="#f8f5ec"/>
    <path d="M-52 22 C-45-20 -23-30 0-30 C23-30 45-20 52 22 L45 126 L14 126 L8 42 L-8 42 L-14 126 L-45 126 Z" fill="#f8f5ec"/>
    <path d="M-52 15 L-103 92" stroke="#f8f5ec" stroke-width="22" stroke-linecap="round"/>
    <path d="M52 15 L103 92" stroke="#f8f5ec" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- FAMILY -->
  <g transform="translate(350 218)" filter="url(#shadow)">
    <circle r="96" fill="#0a1523" stroke="#f0bd68" stroke-width="3"/>
    <circle r="82" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M-52 12 V-28 L0-66 L52-28 V42 H17 V3 H-17 V42 H-52 Z" fill="none" stroke="#f8f5ec" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="-22" cy="10" r="10" fill="#f0bd68"/>
    <circle cx="22" cy="10" r="10" fill="#f0bd68"/>
    <path d="M-43 37 C-40 20-31 14-22 14 C-13 14-4 20-1 37" fill="none" stroke="#f0bd68" stroke-width="6" stroke-linecap="round"/>
    <path d="M1 37 C4 20 13 14 22 14 C31 14 40 20 43 37" fill="none" stroke="#f0bd68" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="132" fill="#f8f5ec" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Family</text>
  </g>

  <!-- GIRLFRIEND -->
  <g transform="translate(610 128)" filter="url(#shadow)">
    <circle r="96" fill="#0a1523" stroke="#f0bd68" stroke-width="3"/>
    <circle r="82" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M0 55 C-72 10-65-48-28-56 C-5-61 7-43 0-29 C7-43 5-61 28-56 C65-48 72 10 0 55 Z" fill="#f0bd68"/>
    <path d="M-22 3 C-10 13 10 13 22 3" fill="none" stroke="#07111f" stroke-width="7" stroke-linecap="round"/>
    <text x="0" y="132" fill="#f8f5ec" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Girlfriend</text>
  </g>

  <!-- WORK -->
  <g transform="translate(990 128)" filter="url(#shadow)">
    <circle r="96" fill="#0a1523" stroke="#f0bd68" stroke-width="3"/>
    <circle r="82" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
    <rect x="-55" y="-44" width="110" height="72" rx="6" fill="none" stroke="#f8f5ec" stroke-width="8"/>
    <path d="M-68 45 H68" stroke="#f8f5ec" stroke-width="9" stroke-linecap="round"/>
    <path d="M-30 8 L-8-12 L12 2 L37-25" fill="none" stroke="#f0bd68" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="132" fill="#f8f5ec" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Work</text>
  </g>

  <!-- STUDIES -->
  <g transform="translate(1250 218)" filter="url(#shadow)">
    <circle r="96" fill="#0a1523" stroke="#f0bd68" stroke-width="3"/>
    <circle r="82" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M-58 30 H58 M-48 8 H48 M-38-14 H38" stroke="#f8f5ec" stroke-width="11" stroke-linecap="round"/>
    <path d="M-60 49 C-30 35 30 35 60 49" fill="none" stroke="#f0bd68" stroke-width="7" stroke-linecap="round"/>
    <text x="0" y="132" fill="#f8f5ec" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Studies</text>
  </g>

  <!-- LEARNING -->
  <g transform="translate(800 620)" filter="url(#shadow)">
    <circle r="96" fill="#0a1523" stroke="#f0bd68" stroke-width="3"/>
    <circle r="82" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M0-54 C-31-54-52-32-52-4 C-52 17-41 28-29 39 C-21 46-18 52-18 60 H18 C18 52 21 46 29 39 C41 28 52 17 52-4 C52-32 31-54 0-54Z" fill="none" stroke="#f8f5ec" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-19 20 H19 M-17 72 H17" stroke="#f0bd68" stroke-width="8" stroke-linecap="round"/>
    <path d="M0-82 V-103 M-75-53 L-91-70 M75-53 L91-70 M-84 10 H-106 M84 10 H106" stroke="#f0bd68" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="132" fill="#f8f5ec" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Learning</text>
  </g>

  <g transform="translate(800 272)">
    <rect x="-154" y="-28" width="308" height="56" rx="28" fill="#06101d" fill-opacity=".88" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="0" y="9" fill="#f0bd68" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="800" letter-spacing="2" text-anchor="middle">MY PRIORITIES</text>
  </g>
</svg>